# 系统代理模式 - 极简版
# 已删除: TUN / Fake-IP / 嗅探 / redir / tproxy

proxy-providers:
  Airport1:
    url: "h6fa"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

proxies:
    - {name: 直连, type: direct}

# ==================== 全局 - 只留系统代理要用的 ====================
port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
log-level: warning

# ==================== DNS - 普通模式，不用 Fake-IP ====================
dns:
  enable: true
  ipv6: false
  enhanced-mode: normal
  nameserver:
        - https://dns.alidns.com/dns-query
        - https://doh.pub/dns-query
  nameserver-policy:
    "rule-set:geolocation-!cn":
        - https://cloudflare-dns.com/dns-query
        - https://dns.google/dns-query

# ==================== 策略组 - 只留 2 个 ====================
proxy-groups:
  # 1. 自动测速：除了 AI Route 以外的所有节点
    - name: 自动测速
    type: url-test
    include-all: true
    filter: "^(?!.*AI Route).*$"
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50

  # 2. AI-优选：只筛选含有 AI Route 的节点
    - name: AI-优选
    type: url-test
    use: [Airport1]
    filter: ".*AI Route.*"
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50

# ==================== 规则集 ====================
rule-providers:
  OpenAI: {type: http, behavior: domain, format: mrs, interval: 86400, url: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/openai.mrs", proxy: 直连}
  Telegram: {type: http, behavior: domain, format: mrs, interval: 86400, url: "https://raw.githubusercontent.com/metacubex/meta-rules-dat/meta/geo/geosite/telegram.mrs", proxy: 直连}
  geolocation-!cn: {type: http, behavior: domain, format: mrs, interval: 86400, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs", proxy: 直连}
  CN_Site: {type: http, behavior: domain, format: mrs, interval: 86400, url: "https://raw.githubusercontent.com/metacubex/meta-rules-dat/meta/geo/geosite/cn.mrs", proxy: 直连}
  CN_IP: {type: http, behavior: ipcidr, format: mrs, interval: 86400, url: "https://raw.githubusercontent.com/metacubex/meta-rules-dat/meta/geo/geoip/cn.mrs", proxy: 直连}

# ==================== 规则 ====================
rules:
    - GEOIP,lan,DIRECT,no-resolve
    - GEOSITE,private,DIRECT

  # AI 走 AI-优选
    - RULE-SET,OpenAI,AI-优选
    
  # 其他国外走自动测速
    - RULE-SET,Telegram,自动测速
    - RULE-SET,geolocation-!cn,自动测速

  # 国内直连
    - RULE-SET,CN_Site,DIRECT
    - RULE-SET,CN_IP,DIRECT,no-resolve
  
  # 兜底
    - MATCH,自动测速
